; Weather station LVGL port for Guition JC3248W535C (landscape 480x320)
; Port of ../weather_station_1 (Arduino_GFX direct-draw) to LVGL v8,
; reusing proven display/touch bring-up from ../netradio (AXS15231B QSPI + Canvas bulk flush).
; Board: ESP32-S3 N16R8 (16MB flash, 8MB OPI PSRAM)

[env:jc3248w535c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_16MB_cyd.csv

monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
upload_speed = 921600

build_flags =
  -I include
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DESP32QSPI_MAX_PIXELS_AT_ONCE=8192

lib_deps =
  moononournation/GFX Library for Arduino@1.6.9
  lvgl/lvgl@^8.3.11
  bblanchon/ArduinoJson@^7.4.3
